name: Release

on:
  # push:
  #   tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew build audit -PstrictAudit -PreleaseVersion=${{ steps.version.outputs.version }} --no-daemon

      - name: Checksum
        run: |
          cd build/libs
          sha256sum domi-reversi-burp-${{ steps.version.outputs.version }}.jar > domi-reversi-burp-${{ steps.version.outputs.version }}.jar.sha256
          cat *.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Domi Reversi ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            build/libs/domi-reversi-burp-${{ steps.version.outputs.version }}.jar
            build/libs/domi-reversi-burp-${{ steps.version.outputs.version }}.jar.sha256
