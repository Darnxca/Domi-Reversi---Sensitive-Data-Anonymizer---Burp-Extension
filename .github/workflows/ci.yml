name: CI

on:
  # push:
  #   branches: [main]
  # pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  build:
    name: Build & test (${{ matrix.os }}, JDK ${{ matrix.java }})
    needs: wrapper-validation
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17', '21']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, unit tests, adversarial round-trip and GraphQL tests
        run: ./gradlew build --no-daemon --stacktrace

      - name: Extended anonymization audit
        run: ./gradlew audit -PstrictAudit --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            build/reports/tests/test/
            build/reports/audit/
            build/reports/adversarial/
          retention-days: 14

      - name: Upload extension jar
        if: matrix.os == 'ubuntu-latest' && matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: domi-reversi-burp-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
