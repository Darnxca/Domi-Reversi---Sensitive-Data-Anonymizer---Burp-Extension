plugins {
    id 'java'
    // Shadow: impacchetta Gson dentro il jar (installazione one-click).
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'com.domireversi'
// La CI di release passa la versione dal tag: ./gradlew build -PreleaseVersion=1.2.3
version = project.findProperty('releaseVersion') ?: '1.2.0'

java {
    // Compila col JDK che esegue Gradle (qualunque >= 17), mirando al bytecode
    // Java 17. Niente toolchain da scaricare -> build portabile ovunque.
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

repositories {
    mavenCentral()
}

dependencies {
    // Montoya e' fornita da Burp a runtime: solo in compilazione, NON nel jar.
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.7'
    // Gson viene bundlato (e rilocato) nel jar finale.
    implementation 'com.google.code.gson:gson:2.14.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    // la batteria estesa (tag "audit") gira a parte: ./gradlew audit
    useJUnitPlatform { excludeTags 'audit' }
    systemProperty 'file.encoding', 'UTF-8'
    testLogging { events 'failed'; exceptionFormat 'full' }
}

// Batteria estesa di anonimizzazione (~2400 casi generati). In locale non blocca
// la build; in CI si usa -PstrictAudit per farla fallire al primo errore.
tasks.register('audit', Test) {
    description = 'Batteria estesa di test di anonimizzazione'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'audit' }
    systemProperty 'file.encoding', 'UTF-8'
    ignoreFailures = !project.hasProperty('strictAudit')
    outputs.upToDateWhen { false }
    reports.html.outputLocation = layout.buildDirectory.dir('reports/audit')
    reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/audit')
    afterSuite { desc, result ->
        if (!desc.parent) {
            println "\nAUDIT: ${result.testCount} test, ${result.successfulTestCount} ok, " +
                    "${result.failedTestCount} falliti, ${result.skippedTestCount} saltati"
            println "Report: build/reports/audit/index.html"
        }
    }
}

shadowJar {
    // il jar da caricare in Burp e' questo (senza suffisso '-all')
    archiveClassifier = ''
    // rilocazione di Gson: evita conflitti con Burp o altre estensioni
    relocate 'com.google.gson', 'com.domireversi.shaded.gson'
    manifest {
        attributes(
                'Implementation-Title': 'Domi Reversi - Sensitive Data Anonymizer',
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'Domi Reversi')
    }
    // le risorse (sensitive_headers/patterns.json, META-INF/services) sono gia'
    // incluse di default da processResources -> non ri-aggiungerle (duplicati).
}

// 'gradle build' produce il jar autonomo pronto per Burp / BApp Store
build.dependsOn shadowJar
